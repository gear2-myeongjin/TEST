name: Build TvpAAM.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tvp-autotools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run logic tests
        run: python -m pytest -q tests

      - name: Download TVPaint 11 RPC plugin (MIT, brunchstudio/tvpaint-rpc)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force plugin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/brunchstudio/tvpaint-rpc/releases/download/1.1.0/tvpaint-rpc-1.1.0-tvp-11.dll" -OutFile "plugin/tvpaint-rpc.dll"

      - name: Build single EXE
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name TvpAAM
          --icon assets/icon.ico
          --add-data "plugin/tvpaint-rpc.dll;plugin"
          --add-data "assets/icon.ico;assets"
          --collect-submodules pytvpaint
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: TvpAAM
          path: tvp-autotools/dist/TvpAAM.exe
